# /etc/nginx/conf.d/exmaple.com.conf
#
# Application: Hitokoto library service
# Upstream:    127.0.0.1:13469 (optional [::1]:13469)
# Domain:      exmaple.com
# Listen:      IPv4 + IPv6 on 80/443
#
# Certificate paths (placeholder, replace with your own):
#   /mnt/ssl/exmaple.com/fullchain.pem
#   /mnt/ssl/exmaple.com/privkey.pem
#
# The certificate must be valid for exmaple.com (a *.exmaple.com wildcard
# certificate, or a certificate with exmaple.com in its SAN list).

upstream hitokoto_backend {
    # IPv4 loopback works on every Linux host. If this host also has an
    # IPv6 loopback (::1), add the second line to let Nginx use it as a
    # failover backend:
    server 127.0.0.1:13469;
    # server [::1]:13469;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80 ipv6only=on;
    server_name exmaple.com;

    return 301 https://$host$request_uri;
}

server {
    # Kept as "443 ssl http2" to match the documented TLS/HTTP2 setup.
    # On Nginx 1.25.1+ this form still works but logs a deprecation warning;
    # the equivalent newer form is:
    #   listen 443 ssl;
    #   http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;
    server_name exmaple.com;

    ssl_certificate     /mnt/ssl/exmaple.com/fullchain.pem;
    ssl_certificate_key /mnt/ssl/exmaple.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;

    access_log /var/log/nginx/exmaple.com.access.log;
    error_log  /var/log/nginx/exmaple.com.error.log warn;

    location / {
        proxy_pass http://hitokoto_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
