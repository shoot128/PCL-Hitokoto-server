# /etc/nginx/conf.d/yiyan.overpass.top.conf
#
# Application: Hitokoto library service
# Upstream:    127.0.0.1:13469
# Domain:      yiyan.overpass.top
#
# Certificate paths:
#   /mnt/ssl/overpass.top/fullchain.pem
#   /mnt/ssl/overpass.top/privkey.pem
#
# These are the certificate paths fixed earlier. The certificate must be
# valid for yiyan.overpass.top (a *.overpass.top wildcard certificate, or a
# certificate with yiyan.overpass.top in its SAN list). If the certificate
# actually lives under /mnt/ssl/yiyan.overpass.top/, change the two ssl_*
# paths below to that directory.

upstream hitokoto_backend {
    server 127.0.0.1:13469;
    keepalive 16;
}

server {
    listen 80;
    server_name yiyan.overpass.top;

    return 301 https://$host$request_uri;
}

server {
    # Kept as "443 ssl http2" to match the requested TLS/HTTP2 setup.
    # On Nginx 1.25.1+ this form still works but logs a deprecation warning;
    # the equivalent newer form is:
    #   listen 443 ssl;
    #   http2 on;
    listen 443 ssl http2;
    server_name yiyan.overpass.top;

    ssl_certificate     /mnt/ssl/overpass.top/fullchain.pem;
    ssl_certificate_key /mnt/ssl/overpass.top/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;

    access_log /var/log/nginx/yiyan.overpass.top.access.log;
    error_log  /var/log/nginx/yiyan.overpass.top.error.log warn;

    location / {
        proxy_pass http://hitokoto_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
